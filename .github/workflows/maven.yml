name: API TEST FRAMEWORK

on:
  push:
    branches: [ "JSAPIAUTOMATIONMASTER" ]
  pull_request:
    branches: [ "JSAPIAUTOMATIONMASTER" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Execute Test
      run: mvn clean test -Dsuite=testng
